tags:
  - Books
summary: Elimina un libro
parameters:
  - name: X-Username
    in: header
    type: string
    required: true
  - name: book_id
    in: path
    type: integer
    required: true
responses:
  200:
    description: Eliminado
    schema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
  401:
    $ref: "#/responses/Unauthorized"
  403:
    $ref: "#/responses/Forbidden"
  500:
    $ref: "#/responses/InternalError"