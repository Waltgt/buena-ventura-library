tags:
  - Books
summary: Obtiene todos los libros del catálogo
responses:
  200:
    description: Lista de libros obtenida exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id_book:
                type: integer
                example: 1
              isbn:
                type: string
                example: "978-3-16-148410-0"
              title:
                type: string
                example: Cien años de soledad
              publication_date:
                type: string
                example: "1967-05-30"
              stock:
                type: integer
                example: 5
              status:
                type: string
                enum: [disponible, prestado]
                example: disponible
              id_author:
                type: integer
                example: 1
              id_editorial:
                type: integer
                example: 1
              author_name:
                type: string
                example: Gabriel García Márquez
              editorial_name:
                type: string
                example: Sudamericana
        count:
          type: integer
          example: 10
        message:
          type: string
          example: Books retrieved successfully
