tags:
  - Books
summary: Obtiene todos los libros del catálogo
responses:
  200:
    description: Lista de libros obtenida exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id_book:
                type: integer
              isbn:
                type: string
              title:
                type: string
              publication_date:
                type: string
              stock:
                type: integer
              status:
                type: string
                enum: [disponible, prestado]
              author:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
              editorial:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        count:
          type: integer
        message:
          type: string
          example: Books retrieved successfully