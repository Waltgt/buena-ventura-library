tags:
  - Books

summary: Actualiza los datos de un libro existente

description: Solo usuarios con rol Gestor o Administrador. Requiere el header X-Username.

parameters:
  - name: X-Username
    in: header
    type: string
    required: true
    description: Usuario que realiza la petición

  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - id_book
        - title
        - publication_date
        - stock
        - id_author
        - id_editorial
      properties:
        id_book:
          type: integer
        title:
          type: string
        publication_date:
          type: string
        stock:
          type: integer
        status:
          type: string
          enum: [disponible, prestado]
        id_author:
          type: integer
        id_editorial:
          type: integer

responses:
  200:
    description: Libro actualizado exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          example: Libro actualizado exitosamente

  400:
    description: Datos inválidos o el libro no existe
    schema:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
        error_type:
          type: string

  401:
    description: Falta el header X-Username o el usuario no existe
    schema:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string

  403:
    description: El usuario no tiene rol Gestor o Administrador
    schema:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string

  500:
    description: Error interno del servidor
    schema:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
        error_type:
          type: string