tags:
  - Books
summary: Actualiza los datos de un libro existente
description: Solo usuarios con rol Gestor o Administrador. Requiere el header X-Username.
parameters:
  - name: X-Username
    in: header
    type: string
    required: true
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - id_book
        - title
        - publication_date
        - stock
        - id_author
        - id_editorial
      properties:
        id_book:
          type: integer
        title:
          type: string
        publication_date:
          type: string
        stock:
          type: integer
        status:
          type: string
          enum: [disponible, prestado]
        id_author:
          type: integer
        id_editorial:
          type: integer
responses:
  200:
    description: Libro actualizado exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id_book:
              type: integer
            isbn:
              type: string
            title:
              type: string
            publication_date:
              type: string
            stock:
              type: integer
            status:
              type: string
            author:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            editorial:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
        message:
          type: string
          example: Book updated successfully
  400:
    description: Datos inválidos o el libro no existe
    schema:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
        error_type:
          type: string