tags:
  - Books
summary: Obtiene un libro por su ID
parameters:
  - name: book_id
    in: path
    type: integer
    required: true
    description: ID del libro a consultar
responses:
  200:
    description: Libro obtenido exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id_book:
              type: integer
              example: 1
            isbn:
              type: string
              example: "978-3-16-148410-0"
            title:
              type: string
              example: Cien años de soledad
            publication_date:
              type: string
              example: "1967-05-30"
            stock:
              type: integer
              example: 5
            id_author:
              type: integer
              example: 1
            id_editorial:
              type: integer
              example: 1
            author_name:
              type: string
              example: Gabriel García Márquez
            editorial_name:
              type: string
              example: Sudamericana
        count:
          type: integer
          example: 1
        message:
          type: string
          example: Book retrieved successfully
