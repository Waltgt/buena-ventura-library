tags:
  - Books
summary: Obtiene un libro por su ID
parameters:
  - name: book_id
    in: path
    type: integer
    required: true
responses:
  200:
    description: Libro obtenido exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id_book:
              type: integer
            isbn:
              type: string
            title:
              type: string
            publication_date:
              type: string
            stock:
              type: integer
            status:
              type: string
              enum: [disponible, prestado]
            author:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            editorial:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
        count:
          type: integer
          example: 1
        message:
          type: string
          example: Book retrieved successfully