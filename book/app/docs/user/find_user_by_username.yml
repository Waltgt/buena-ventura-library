tags:
  - Users
summary: Busca un usuario por su nombre de usuario
parameters:
  - name: X-Username
    in: header
    type: string
    required: true
    description: Usuario que realiza la petición (debe tener rol Gestor o Administrador)
  - name: username
    in: path
    type: string
    required: true
    description: Nombre de usuario a buscar
responses:
  200:
    description: Usuario encontrado
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id_user:
              type: integer
              example: 1
            username:
              type: string
              example: jdoe
            customer_name:
              type: string
              example: John
            customer_last_name:
              type: string
              example: Doe
            email:
              type: string
              example: jdoe@mail.com
            phone_number:
              type: string
              example: "50212345678"
            identification_number:
              type: string
              example: "1234567890101"
            id_rol:
              type: integer
              example: 1
        message:
          type: string
          example: User found successfully
  404:
    description: Usuario no encontrado
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        message:
          type: string
          example: User not found
  500:
    description: Error interno del servidor
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Internal server error
        message:
          type: string
          example: An unexpected error occurred
        error_type:
          type: string
          example: InternalError