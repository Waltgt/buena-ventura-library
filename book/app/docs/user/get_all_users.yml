tags:
  - Users
summary: Obtiene todos los usuarios del sistema
responses:
  200:
    description: Lista de usuarios obtenida exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id_user:
                type: integer
                example: 1
              username:
                type: string
                example: jdoe
              customer_name:
                type: string
                example: John
              customer_last_name:
                type: string
                example: Doe
              email:
                type: string
                example: jdoe@mail.com
              phone_number:
                type: string
                example: "50212345678"
              identification_number:
                type: string
                example: "1234567890101"
              id_rol:
                type: integer
                example: 1
        count:
          type: integer
          example: 5
        message:
          type: string
          example: Users retrieved successfully
  500:
    description: Error interno del servidor
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Internal server error
        message:
          type: string
          example: Error retrieving users