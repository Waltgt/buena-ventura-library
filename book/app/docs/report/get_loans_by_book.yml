tags:
  - Reports
summary: Historial de préstamos por libro
description: Solo usuarios con rol Administrador. Requiere el header X-Username.
parameters:
  - name: X-Username
    in: header
    type: string
    required: true
    description: Usuario que realiza la petición (debe tener rol Administrador)
  - name: book_id
    in: path
    type: integer
    required: true
    description: ID del libro del cual se consulta el historial
  - name: format
    in: query
    type: string
    required: false
    enum: [json, csv]
    description: Formato de salida. Por defecto JSON; con 'csv' descarga un archivo.
responses:
  200:
    description: Historial obtenido exitosamente
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id_loan:
                type: integer
                example: 1
              book_title:
                type: string
                example: Cien años de soledad
              isbn:
                type: string
                example: "978-3-16-148410-0"
              editorial_name:
                type: string
                example: Sudamericana
              author_name:
                type: string
                example: Gabriel García Márquez
              user_loan_name:
                type: string
                example: John Doe
              delivery_date:
                type: string
                example: "2026-06-06T00:00:00"
              expected_return_date:
                type: string
                example: "2026-06-20T00:00:00"
              real_return_date:
                type: string
                nullable: true
                example: null
              status_code:
                type: string
                example: ACT
        count:
          type: integer
          example: 1
        message:
          type: string
          example: Loan history by book retrieved successfully
  401:
    description: Falta el header X-Username o el usuario no existe
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Authentication required
        message:
          type: string
          example: "Falta el encabezado 'X-Username'"
  403:
    description: El usuario no tiene rol Administrador
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Insufficient permissions
        message:
          type: string
          example: Se requiere rol Gestor o Administrador
  500:
    description: Error interno del servidor
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Internal server error
        message:
          type: string
          example: An unexpected error occurred
        error_type:
          type: string
          example: InternalError
