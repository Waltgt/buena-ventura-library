networks:
  library-network:
    driver: bridge

volumes:
  mysql-data:
  mysql-config:

services:
  mysql-db:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-config:/etc/mysql/conf.d
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 10s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
  
  book-service:
    build:
      context: ./book
      dockerfile: Dockerfile
    container_name: book-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql-db:3306/${DB_NAME}?charset=utf8mb4&use_unicode=1
      - CORS_ORIGIN=http://localhost:5173
      - SERVICE_NAME=book-service
      - PORT=5001
      - FLASK_APP=app.py
      - FLASK_ENV=development
    ports:
      - "5001:5001"
    volumes:
      - ./book:/app
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  


